- defaults:
    link:
      relink: true
    create:
      mode: 0700

- clean: ['~']

- link:
    ~/.config/bat:
      create: true
      path: config/bat
    ~/.config/calcurse:
      create: true
      path: config/calcurse
    ~/.gitconfig:
    ~/.vimrc:
    ~/.zprofile:
    ~/.zshenv:
    ~/.zshrc:

- create:
    - ~/1_Code
    - ~/2_System
    - ~/3_Unterlagen
    - ~/4_Multimedia

- shell:
    - command: ./setup_homebrew.zsh
      stdin: true
      stdout: true
      stderr: true
