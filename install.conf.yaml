- defaults:
    link:
      relink: true
    create:
      mode: 0700

- clean: ['~']

- link:
    ~/.config/bat:
      create: true
      path: config/bat
    ~/.config/calcurse:
      create: true
      path: config/calcurse
    '~/Library/Application Support/Firefox/Profiles/7svrpeld.default-release/user-overrides.js':
      path: firefox/user-overrides.js
    ~/.gitconfig:
    ~/.gnupg/gpg-agent.conf:
      create: true
      path: gnupg/gpg-agent.conf
    ~/.newsboat:
      create: true
      path: newsboat
    ~/.vimrc:
    ~/.zprofile:
    ~/.zshenv:
    ~/.zshrc:

#- create:
#    - ~/1_Arbeit
#    - ~/2_System
#    - ~/3_Unterlagen
#    - ~/4_Notizen
#    - ~/7_Archiv

- shell:
    - command: ./setup_homebrew.zsh
      stdin: true
      stdout: true
      stderr: true
    - command: ./setup_macos.zsh
      stdin: true
      stdout: true
      stderr: true
    - command: ./setup_openjdk.zsh
      stdin: true
      stdout: true
      stderr: true
